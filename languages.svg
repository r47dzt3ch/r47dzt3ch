<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <style>
    .title{font:700 18px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#70a5fd}
    .ln{font:600 13px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#c0caf5}
    .pc{font:600 12px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#a9b1d6}
    .row{opacity:0;animation:fade .5s ease-out forwards}
    .grow,.seg{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes fade{to{opacity:1}}
    @keyframes grow{to{transform:scaleX(1)}}
  </style>
  <rect width="400" height="300" rx="14" fill="#1a1b27" stroke="#2a2e42"/>
  <text x="24" y="36" class="title">💻 Most Used Languages</text>
  <clipPath id="bar"><rect x="24" y="56" width="352" height="12" rx="6"/></clipPath>
  <g clip-path="url(#bar)"><rect x="24" y="56" width="352" height="12" fill="#24283b"/><rect x="24.0" y="56" width="128.7" height="12" fill="#3572A5" class="seg" style="animation-delay:0.20s"/><rect x="152.7" y="56" width="57.4" height="12" fill="#3178c6" class="seg" style="animation-delay:0.28s"/><rect x="210.0" y="56" width="48.2" height="12" fill="#878787" class="seg" style="animation-delay:0.36s"/><rect x="258.2" y="56" width="35.8" height="12" fill="#663399" class="seg" style="animation-delay:0.44s"/><rect x="294.0" y="56" width="29.9" height="12" fill="#4F5D95" class="seg" style="animation-delay:0.52s"/><rect x="323.9" y="56" width="19.6" height="12" fill="#A97BFF" class="seg" style="animation-delay:0.60s"/><rect x="343.5" y="56" width="14.6" height="12" fill="#e34c26" class="seg" style="animation-delay:0.68s"/><rect x="358.0" y="56" width="6.6" height="12" fill="#c6538c" class="seg" style="animation-delay:0.76s"/></g>
  <g class="row" style="animation-delay:0.40s">
