    <text x="42" y="98" class="ln">Python</text>
    <rect x="160" y="89" width="170" height="8" rx="4" fill="#24283b"/>
    <rect x="160" y="89" width="170.0" height="8" rx="4" fill="#3572A5" class="grow" style="animation-delay:0.40s"/>
    <text x="378" y="98" class="pc" text-anchor="end">36.6%</text>
  </g>
