<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="14" viewBox="0 0 1200 14">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#36bcf7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0" y="6" width="1200" height="2" fill="url(#g)"/>
  <ellipse cx="0" cy="7" rx="60" ry="6" fill="url(#spark)">
    <animate attributeName="cx" from="-60" to="1260" dur="4s" repeatCount="indefinite"/>
  </ellipse>
